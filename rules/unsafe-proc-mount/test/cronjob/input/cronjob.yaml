apiVersion: batch/v1
kind: CronJob
metadata:
  name: unsafe-proc-mount-cronjob
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: job
              image: nginx
              securityContext:
                procMount: Unmasked
            - name: safe
              image: nginx
              securityContext:
                procMount: Default
